dataset:
  data_path: data/MassSpecGym.csv
  smile_column: smiles
  split_column: "fold"

model:
  d: 256
  de: 64
  dy: 64
  n_heads: 8
  n_layers: 6
  diffusion_steps: 500
  noise_strategy: uniform
  num_ev: 10
  extra_features:
    - laplacian_embedding
    - node_cycle

train:
  batch_size: 256
  num_train_steps: 10000
  loss_ratio: 1
  learning_rate: 0.0001
  save_path: logs/experiment_test
  save_steps: 1000
  num_workers: 4
  seed: 24

valid:
  batch_size: 256
  num_eval_steps: 1000

test:
  batch_size: 256
