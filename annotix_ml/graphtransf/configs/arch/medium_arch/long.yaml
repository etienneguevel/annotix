run:
  project: annotix_ml
  name: digress_medium_long

model:
  d: 256
  de: 64
  dy: 64
  n_heads: 8
  n_layers: 12
  diffusion_steps: 500
  noise_strategy: distribution
  last_layer: mlp
  num_ev: 2
  extra_features:
    - laplacian_embedding
    - node_cycle

train:
  batch_size: 512
  num_train_steps: 40000