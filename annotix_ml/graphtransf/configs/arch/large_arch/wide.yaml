run:
  project: annotix_ml
  name: digress_large_wide

model:
  d: 1024
  de: 256
  dy: 256
  n_heads: 16
  n_layers: 5
  diffusion_steps: 500
  noise_strategy: distribution
  last_layer: mlp
  num_ev: 2
  extra_features:
    - laplacian_embedding
    - node_cycle

train:
  batch_size: 512
  num_train_steps: 100000
  save_path: logs/qm9_large_wide
