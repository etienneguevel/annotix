run:
  project: annotix_ml_moses
  name: defog_moses_small_polydec

dataset:
  data_path: data/moses.csv
  smile_column: SMILES
  split_column: SPLIT
  cache_path: data/cache/moses_san
  val_tag: val

model:
  arch: defog
  d: 256
  de: 64
  dy: 64
  n_heads: 8
  n_layers: 6
  diffusion_steps: 500
  noise_strategy: marginal
  no_y: True
  num_ev: 5
  extra_features:
    - laplacian_embedding
    - node_cycle
    - valence_features
  train_distortion: polydec
  sample_distortion: polydec

train:
  global_batch_size: 1024
  num_train_steps: 100000
  save_steps: 10000
  save_path: logs/moses_defog_baseline
  compile: False

valid:
  batch_size: 1024
  num_samples: 1024
  num_eval_steps: 10000
