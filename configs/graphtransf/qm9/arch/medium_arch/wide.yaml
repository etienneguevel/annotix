run:
  project: annotix_ml
  name: digress_medium_wide

dataset:
  data_path: data/qm9.csv

model:
  d: 384
  de: 96
  dy: 96
  n_heads: 12
  n_layers: 5
  diffusion_steps: 500
  noise_strategy: distribution
  last_layer: mlp
  num_ev: 2
  extra_features:
    - laplacian_embedding
    - node_cycle
    - valence_features

train:
  batch_size: 512
  num_train_steps: 40000
  save_path: logs/qm9_medium_wide
