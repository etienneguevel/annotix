run:
  name: test_pp

model:
  y_update: False
  no_y: True
  diffusion_steps: 500
  noise_strategy: distribution
  last_layer: mlp
  num_ev: 2
  extra_features:
    - laplacian_embedding
    - node_cycle
    - valence_features

train:
  batch_size: 512
  num_train_steps: 100000
  save_steps: 4000
  distributed: "pipeline"
  num_microbatches: 4
  num_workers: 1
