run:
  project: annotix_ml
  name: digress_large_long

model:
  d: 768
  de: 192
  dy: 192
  n_heads: 12
  n_layers: 16
  diffusion_steps: 500
  noise_strategy: distribution
  last_layer: mlp
  num_ev: 2
  extra_features:
    - laplacian_embedding
    - node_cycle

train:
  batch_size: 512
  num_train_steps: 100000
  save_path: logs/qm9_large_long
