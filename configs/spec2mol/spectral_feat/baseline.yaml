run:
  project: annotix_msg
  name: ms2_from_preprocessed

dataset:
  data_path: data/msg/labels_.csv
  spec_folder: data/msg/spec_files
  subform_folder: data/msg/subformulae/default_subformulae
  datadir: data/BanyulsInference
  labels_file: data/BanyulsInference/labels.tsv
  morgan_nbits: 2048
  cache_path: data/cache/msg_70nodes
  val_tag: test
  max_nodes: 70

model:
  y_update: False
  no_y: True
  diffusion_steps: 500
  noise_strategy: distribution
  num_ev: 5
  extra_features:
    - laplacian_embedding
    - node_cycle
    - valence_features
    - spectra_fingerprint

spectra_encoder:
  form_embedder: pos-cos
  output_size: 4096
  hidden_size: 512
  spectra_dropout: 0
  top_layers: 1
  magma_modulo: 2048
  peak_attn_layers: 2
  set_pooling: intensity
  pairwise_featurization: True
  num_heads: 8
  embed_instrument: False
  inten_transform: float
  no_diffs: False
  refine_layers: 4
  checkpoint_path: checkpoints/encoder_msg.pt

train:
  num_train_steps: 200000
  save_path: logs/msg/pretrain_from_preprocessed
  save_steps: 10000
  global_batch_size: 1024
  mini_batch_size: 256

valid:
  num_eval_steps: 10000
