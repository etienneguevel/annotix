run:

dataset:
  smile_column: smiles
  split_column: split
  val_tag: test
  cache_path: null

model:
  d: 256
  de: 64
  dy: 64
  n_heads: 8
  n_layers: 5
  y_update: False
  no_y: True
  diffusion_steps: 500
  noise_strategy: distribution
  num_ev: 2
  extra_features:
    - laplacian_embedding
    - node_cycle
    - valence_features

train:
  batch_size: 512
  num_train_steps: 40000
  loss_ratio: 1
  starting_learning_rate: 0.0002
  final_learning_rate: 0.000001
  learning_rate_schedule: cosine
  save_steps: 1000
  num_workers: 4
  seed: 24
  distributed:
  num_microbatches:

valid:
  batch_size: 512
  num_samples: 1024
  num_eval_steps: 4000
