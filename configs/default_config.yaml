run:

dataset:
  smile_column: smiles
  split_column: split
  val_tag: test
  cache_path: null
  max_nodes: null
  morgan_nbits: 0
  morgan_radius: 3

model:
  d: 256
  de: 64
  dy: 64
  n_heads: 8
  n_layers: 5
  y_update: False
  no_y: True
  diffusion_steps: 500
  arch: digress
  noise_strategy: distribution
  num_ev: 2
  extra_features:
    - laplacian_embedding
    - node_cycle
    - valence_features

  fp_projector_type: linear

train:
  global_batch_size: 512 # total effective batch size (all ranks × accum steps)
  mini_batch_size: 512 # per-rank per-step batch size
  num_train_steps: 40000
  loss_ratio: 1
  starting_learning_rate: 0.0002
  final_learning_rate: 0.000001
  learning_rate_schedule: cosine
  save_steps: 1000
  num_workers: 4
  seed: 24
  distributed:
  num_microbatches:
  mixed_precision: True
  compile: True

valid:
  batch_size: 512
  num_samples: 1024
  num_eval_steps: 4000
  max_eval_samples: null
  main_rank_only_generation: false
