[project]
name = "annotix_ml"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "rdkit>=2025.9.1",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
rest = [
    "loguru>=0.7.3",
    "matchms>=0.27.0",
    "matplotlib>=3.10.7",
    "psycopg2-binary>=2.9.11",
    "spec2vec>=0.8.0",
]
notebook = [
    "huggingface-hub>=1.1.5",
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["annotix_ml"]
exclude = []
namespaces = false

[dependency-groups]
dev = [
    "ruff",
    "pre-commit>=4.3.0",
    "pylint==2.15.0",
    "pytest>=8.4.2",
]
