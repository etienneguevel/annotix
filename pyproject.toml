[project]
name = "annotix_ml"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "ipykernel>=6.30.1",
    "loguru>=0.7.3",
    "matchms>=0.27.0",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "pytest>=8.4.2",
    "rdkit>=2025.9.1",
    "scipy>=1.16.2",
    "spec2vec>=0.8.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["annotix_ml"]
exclude = []
namespaces = false
